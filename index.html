<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scense — Scent Scape</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1c1a18;
    font-family: 'Inter', system-ui, sans-serif;
    color: #f3e8d0;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #canvas {
    display: block;
    width: 100%; height: 100%;
    position: fixed; inset: 0;
    cursor: grab;
  }
  #canvas:active { cursor: grabbing; }

  /* --- Floating label over hovered objects --- */
  #label {
    position: fixed;
    left: 0; top: 0;
    transform: translate(-50%, -100%) translateY(-14px);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(.2,.9,.3,1.2);
    z-index: 20;
    will-change: transform, opacity;
  }
  #label.visible {
    opacity: 1;
    transform: translate(-50%, -100%) translateY(-20px);
  }
  .label-bubble {
    background: rgba(24, 28, 22, 0.72);
    backdrop-filter: blur(14px) saturate(1.25);
    -webkit-backdrop-filter: blur(14px) saturate(1.25);
    border: 1px solid rgba(255, 245, 220, 0.14);
    border-radius: 16px;
    padding: 10px 18px 11px;
    min-width: 160px;
    text-align: center;
    color: #f6ecd2;
    white-space: nowrap;
    box-shadow:
      0 14px 40px rgba(0, 0, 0, 0.28),
      0 2px 6px rgba(0, 0, 0, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    position: relative;
  }
  .label-bubble::after {
    content: "";
    position: absolute;
    bottom: -5px; left: 50%;
    width: 9px; height: 9px;
    background: rgba(24, 28, 22, 0.72);
    border-right: 1px solid rgba(255, 245, 220, 0.14);
    border-bottom: 1px solid rgba(255, 245, 220, 0.14);
    transform: translateX(-50%) rotate(45deg);
  }
  .label-name {
    display: block;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.015em;
    line-height: 1.1;
  }
  .label-scent-kicker {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #b9a67a;
    margin-top: 6px;
  }
  .label-scent {
    display: block;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 12.5px;
    font-weight: 300;
    letter-spacing: 0.015em;
    color: #e9dcbb;
    margin-top: 2px;
    opacity: 0.92;
  }

  /* --- HUD --- */
  .hud {
    position: fixed;
    pointer-events: none;
    z-index: 10;
  }
  .brand {
    top: 28px; left: 32px;
  }
  .brand .title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.02em;
    color: #f6ecd2;
    line-height: 1;
  }
  .brand .tag {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #b9a67a;
    margin-top: 8px;
  }
  .brand .rule {
    width: 28px; height: 1px;
    background: #b9a67a;
    opacity: 0.5;
    margin-top: 10px;
  }

  .controls {
    bottom: 26px; left: 32px;
    display: flex;
    gap: 22px;
    align-items: flex-end;
  }
  .ctl {
    display: flex; flex-direction: column; gap: 6px;
    align-items: flex-start;
  }
  .ctl .keys {
    display: flex; gap: 4px;
  }
  .key {
    min-width: 26px;
    height: 26px;
    padding: 0 6px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(30, 28, 24, 0.55);
    border: 1px solid rgba(255, 245, 220, 0.14);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    color: #f6ecd2;
    letter-spacing: 0.04em;
    backdrop-filter: blur(8px);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25);
  }
  .ctl .txt {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #b9a67a;
  }

  .hint {
    bottom: 30px; right: 32px;
    text-align: right;
  }
  .hint .k {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-style: italic;
    color: #f6ecd2;
    line-height: 1.4;
    opacity: 0.9;
  }
  .hint .s {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #b9a67a;
    margin-top: 8px;
  }

  /* --- Loading overlay --- */
  #loading {
    position: fixed; inset: 0;
    background: #1c1a18;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity 0.7s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loading-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 300;
    font-style: italic;
    color: #f6ecd2;
    letter-spacing: 0.04em;
  }
  .loading-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #b5c989;
    margin-top: 22px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.8); opacity: 1; }
  }
  .loading-sub {
    margin-top: 14px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #b9a67a;
  }

  /* Subtle vignette overlay (CSS) to complement the post-processing */
  .vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5;
    background:
      radial-gradient(ellipse at center,
        rgba(0,0,0,0) 55%,
        rgba(0,0,0,0.25) 100%);
    mix-blend-mode: multiply;
  }

  @media (max-width: 640px) {
    .brand { top: 18px; left: 18px; }
    .controls { bottom: 18px; left: 18px; gap: 14px; }
    .hint { bottom: 18px; right: 18px; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- Hover label -->
<div id="label" aria-hidden="true">
  <div class="label-bubble">
    <span class="label-name" id="label-text">—</span>
    <span class="label-scent-kicker">scent notes</span>
    <span class="label-scent" id="label-sub">—</span>
  </div>
</div>

<!-- UI -->
<div class="hud brand">
  <div class="title">Scense Scent Scape</div>
  <!-- <div class="tag">a quiet forest</div> -->
  <div class="rule"></div>
</div>

<div class="hud controls">
  <div class="ctl">
    <div class="keys">
      <span class="key">W</span>
    </div>
    <div class="keys">
      <span class="key">A</span>
      <span class="key">S</span>
      <span class="key">D</span>
    </div>
    <div class="txt">Move · Turn</div>
  </div>
</div>

<div class="hud hint">
  <div class="k">explore to find scents</div>
</div>

<div class="vignette"></div>

<div id="loading">
  <div class="loading-title">Loading the Scent Scape…</div>
  <div class="loading-dot"></div>
  <!-- <div class="loading-sub">tending mossy things</div> -->
</div>

<!-- Three.js via import map (CDN) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="./main.js"></script>

</body>
</html>
