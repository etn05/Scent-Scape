<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Garden of Notes</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#f4f1ea;
  --muted:#8a857a;
  --accent:#c9b585;
  --bg:#0a0c12;
  --serif:"ABC Diatype","Boogy Brut Poster Web",Georgia,serif;
  --sans:"ABC Diatype","Boogy Brut Poster Web",-apple-system,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);cursor:none}
#canvas{display:block;width:100%;height:100%;position:fixed;top:0;left:0}

/* loading */
#loading{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:200;transition:opacity .8s ease;
}
#loading.hidden{opacity:0;pointer-events:none}
.loading-title{font-family:var(--serif);font-size:2.2rem;font-weight:300;letter-spacing:.14em;color:var(--ink);text-transform:uppercase}
.loading-bar-wrap{width:200px;height:1px;background:rgba(255,255,255,0.08);margin-top:1.6rem;overflow:hidden}
.loading-bar{height:100%;background:var(--accent);width:0%;transition:width .3s ease}
.loading-label{font-family:var(--sans);font-size:.55rem;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-top:1rem}

/* enter overlay */
#enter{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,12,18,0.55);backdrop-filter:blur(6px);z-index:150;
  cursor:pointer;transition:opacity .5s ease;
}
#enter.hidden{opacity:0;pointer-events:none}
.enter-title{font-family:var(--serif);font-size:1.3rem;font-weight:300;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);font-style:italic}
.enter-sub{font-family:var(--sans);font-size:.6rem;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-top:1.2rem}
.enter-keys{display:flex;gap:1.5rem;margin-top:2rem;font-family:var(--sans);font-size:.55rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.enter-keys span b{color:var(--accent);font-weight:400;margin-right:.5rem}

/* tooltip */
#tooltip{
  position:fixed;left:50%;top:50%;pointer-events:none;
  transform:translate(-50%,-50%);
  opacity:0;transition:opacity .3s ease;z-index:100;
  display:flex;flex-direction:column;align-items:center;gap:.6rem;
}
#tooltip.visible{opacity:1}
#tooltip-card{
  border:1px solid rgba(244,241,234,0.12);
  background:rgba(10,12,18,0.58);
  backdrop-filter:blur(10px);
  padding:1rem 1.6rem 1.1rem;
  min-width:220px;
  text-align:center;
}
#tooltip-word{font-family:var(--serif);font-size:1.5rem;font-weight:300;letter-spacing:.06em;color:var(--ink);display:block;font-style:italic}
#tooltip-cat{font-family:var(--sans);font-size:.55rem;letter-spacing:.4em;text-transform:uppercase;display:block;margin-top:.45rem}
#tooltip-divider{width:30px;height:1px;background:rgba(244,241,234,0.2);margin:.9rem auto .8rem}
#tooltip-notes{font-family:var(--sans);font-size:.6rem;letter-spacing:.28em;text-transform:lowercase;color:var(--muted);display:block;line-height:1.6}

/* crosshair / cursor reticle */
#reticle{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:6px;height:6px;border-radius:50%;
  background:rgba(244,241,234,0.4);
  pointer-events:none;z-index:90;
  transition:transform .3s ease,background .3s ease,width .3s ease,height .3s ease;
}
#reticle.focus{
  width:14px;height:14px;background:transparent;
  border:1px solid var(--accent);
}

/* UI */
.ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50}
.brand{position:absolute;top:2rem;left:2.4rem}
.brand h1{font-family:var(--serif);font-size:1.4rem;font-weight:300;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.brand p{font-family:var(--sans);font-size:.5rem;font-weight:400;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-top:.5rem}
.brand::after{content:'';display:block;width:1.4rem;height:1px;background:var(--accent);opacity:.6;margin-top:.85rem}
.footer{position:absolute;bottom:1.8rem;left:2.4rem;font-family:var(--sans);font-size:.5rem;letter-spacing:.4em;text-transform:uppercase;color:var(--muted)}
.compass{position:absolute;bottom:1.8rem;right:2.4rem;font-family:var(--sans);font-size:.5rem;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);text-align:right}
.compass b{color:var(--ink);font-weight:400;margin-left:.6rem;letter-spacing:.2em;font-family:var(--serif);font-style:italic;font-size:.7rem;text-transform:none}
</style>
</head>
<body>

<div id="loading">
  <div class="loading-title">Garden</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
  <div class="loading-label" id="loading-label">seeding the field…</div>
</div>

<div id="enter" class="hidden">
  <div class="enter-title">a garden of notes</div>
  <div class="enter-sub">click to enter</div>
  <div class="enter-keys">
    <span><b>WASD</b>walk</span>
    <span><b>MOUSE</b>look</span>
    <span><b>ESC</b>release</span>
  </div>
</div>

<canvas id="canvas"></canvas>
<div id="reticle"></div>

<div id="tooltip">
  <div id="tooltip-card">
    <span id="tooltip-word"></span>
    <span id="tooltip-cat"></span>
    <div id="tooltip-divider"></div>
    <span id="tooltip-notes"></span>
  </div>
</div>

<div class="ui">
  <div class="brand"><h1>Garden</h1><p>a field of notes</p></div>
  <div class="footer">five fragrances · move slowly</div>
  <div class="compass">heading <b id="compass-deg">N</b></div>
</div>

<script type="importmap">{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}</script>
<script type="module">
import * as THREE from 'three';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

const mergeGeos = BGU.mergeGeometries || BGU.mergeBufferGeometries;

// ────────────────────────────────────────────────────────────────
// CONSTANTS
// ────────────────────────────────────────────────────────────────
const FOG_COLOR     = new THREE.Color(0x0a0c12);
const ACCENT_COLOR  = new THREE.Color(0xc9b585);
const WORLD_RADIUS  = 28;     // movement bound
const EYE_HEIGHT    = 1.55;
const MOVE_SPEED    = 3.4;    // m/s
const LOOK_SENS     = 0.0024;

// ────────────────────────────────────────────────────────────────
// RENDERER + SCENE
// ────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(FOG_COLOR, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG_COLOR.getHex(), 0.024);

const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.05, 200);
camera.position.set(0, EYE_HEIGHT, 6);

// Subtle ambient for any (rare) standard material; particles ignore lights.
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

// ────────────────────────────────────────────────────────────────
// SHADERS
// ────────────────────────────────────────────────────────────────
const PARTICLE_VERT = /* glsl */`
attribute vec3 aColor;
attribute float aSize;
attribute float aSeed;

uniform float uTime;
uniform float uHighlight;
uniform float uPixelRatio;
uniform float uSwayAmt;
uniform float uSwayFreq;

varying vec3  vColor;
varying float vDepth;
varying float vHighlight;
varying float vSeed;

void main() {
  vec3 pos = position;

  // organic sway: combined sin waves seeded per-particle
  float t  = uTime * uSwayFreq + aSeed * 6.2831;
  vec3 sway = vec3(
    sin(t)            * 0.6,
    sin(t * 1.7 + 1.2) * 0.4,
    cos(t * 0.9 + 0.6) * 0.6
  ) * uSwayAmt;

  // taller particles sway more — fake wind gradient by height
  float heightFactor = clamp(pos.y * 0.4 + 0.2, 0.0, 1.6);
  pos += sway * heightFactor;

  vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
  gl_Position = projectionMatrix * mvPos;

  float dist = max(-mvPos.z, 0.001);

  // size attenuation + highlight pulse
  float pulse  = 1.0 + uHighlight * 0.45 + uHighlight * 0.15 * sin(uTime * 4.0 + aSeed * 12.0);
  float baseSz = aSize * uPixelRatio * pulse;
  gl_PointSize = baseSz * (240.0 / dist);

  vColor     = aColor;
  vDepth     = dist;
  vHighlight = uHighlight;
  vSeed      = aSeed;
}
`;

const PARTICLE_FRAG = /* glsl */`
precision highp float;

varying vec3  vColor;
varying float vDepth;
varying float vHighlight;
varying float vSeed;

uniform vec3  uFogColor;
uniform float uFogDensity;
uniform float uOpacity;
uniform vec3  uHighlightColor;

void main() {
  // soft circular sprite
  vec2 uv = gl_PointCoord - 0.5;
  float d = length(uv);
  if (d > 0.5) discard;

  // smooth alpha falloff with a tiny brighter core
  float core  = smoothstep(0.5, 0.0, d);
  float edge  = pow(core, 1.6);
  float glow  = pow(core, 4.0);

  // base color with highlight tint
  vec3 col = mix(vColor, uHighlightColor, vHighlight * 0.55);
  col += glow * (0.25 + vHighlight * 0.5);

  // exponential depth fade — restores fog under additive blending
  float fog = 1.0 - exp(-uFogDensity * vDepth);
  fog = clamp(fog, 0.0, 1.0);
  col = mix(col, uFogColor, fog * 0.85);

  float alpha = edge * uOpacity * (1.0 - fog * 0.65);
  gl_FragColor = vec4(col, alpha);
}
`;

// ────────────────────────────────────────────────────────────────
// PARTICLE SYSTEM FACTORY
// ────────────────────────────────────────────────────────────────
function createParticleSystem({
  sourceGeometry,
  sampleSurface = true,
  count,
  color,                       // THREE.Color
  highlightColor = ACCENT_COLOR,
  size = 6.0,                  // pixels at 1m
  sizeJitter = 0.6,
  variation = 0.18,            // hsl variation
  swayAmt = 0.02,
  swayFreq = 0.6,
  opacity = 0.95,
}) {
  // build sampler
  const tmpMesh  = new THREE.Mesh(sourceGeometry);
  const sampler  = new MeshSurfaceSampler(tmpMesh).build();

  const positions = new Float32Array(count * 3);
  const colors    = new Float32Array(count * 3);
  const sizes     = new Float32Array(count);
  const seeds     = new Float32Array(count);

  const p   = new THREE.Vector3();
  const c   = new THREE.Color();
  const baseHSL = { h: 0, s: 0, l: 0 };
  color.getHSL(baseHSL);

  for (let i = 0; i < count; i++) {
    sampler.sample(p);
    positions[i * 3 + 0] = p.x;
    positions[i * 3 + 1] = p.y;
    positions[i * 3 + 2] = p.z;

    // varied color in HSL space
    c.setHSL(
      baseHSL.h + (Math.random() - 0.5) * variation * 0.35,
      THREE.MathUtils.clamp(baseHSL.s + (Math.random() - 0.5) * variation * 0.4, 0, 1),
      THREE.MathUtils.clamp(baseHSL.l + (Math.random() - 0.5) * variation, 0, 1)
    );
    colors[i * 3 + 0] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;

    sizes[i] = size * (1 - sizeJitter * 0.5 + Math.random() * sizeJitter);
    seeds[i] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(colors,    3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(sizes,     1));
  geo.setAttribute('aSeed',    new THREE.BufferAttribute(seeds,     1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:           { value: 0 },
      uHighlight:      { value: 0 },
      uPixelRatio:     { value: renderer.getPixelRatio() },
      uSwayAmt:        { value: swayAmt },
      uSwayFreq:       { value: swayFreq },
      uFogColor:       { value: FOG_COLOR },
      uFogDensity:     { value: 0.034 },
      uOpacity:        { value: opacity },
      uHighlightColor: { value: highlightColor },
    },
    vertexShader:   PARTICLE_VERT,
    fragmentShader: PARTICLE_FRAG,
    transparent:    true,
    depthWrite:     false,
    depthTest:      true,
    blending:       THREE.AdditiveBlending,
  });

  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false; // sway can push verts outside bounds
  return { points, material: mat };
}

// ────────────────────────────────────────────────────────────────
// SOURCE GEOMETRIES (hidden — used for sampling + raycasting)
// ────────────────────────────────────────────────────────────────
function transformed(geo, { pos = [0,0,0], rot = [0,0,0], scl = [1,1,1] } = {}) {
  const m = new THREE.Matrix4().compose(
    new THREE.Vector3(...pos),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)),
    new THREE.Vector3(...scl),
  );
  return geo.clone().applyMatrix4(m);
}

function buildLotusSource() {
  const parts = [];
  // soft central bud
  parts.push(transformed(new THREE.SphereGeometry(0.16, 14, 10), { pos: [0, 0.18, 0] }));
  // 8 outer petals
  const N = 8;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const petal = new THREE.SphereGeometry(0.22, 10, 8);
    const m = new THREE.Matrix4()
      .multiply(new THREE.Matrix4().makeTranslation(Math.cos(a) * 0.32, 0.16, Math.sin(a) * 0.32))
      .multiply(new THREE.Matrix4().makeRotationY(-a))
      .multiply(new THREE.Matrix4().makeRotationZ(-0.55))
      .multiply(new THREE.Matrix4().makeScale(1.6, 0.35, 0.7));
    petal.applyMatrix4(m);
    parts.push(petal);
  }
  // 5 inner petals
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + 0.3;
    const petal = new THREE.SphereGeometry(0.16, 10, 8);
    const m = new THREE.Matrix4()
      .multiply(new THREE.Matrix4().makeTranslation(Math.cos(a) * 0.18, 0.24, Math.sin(a) * 0.18))
      .multiply(new THREE.Matrix4().makeRotationY(-a))
      .multiply(new THREE.Matrix4().makeRotationZ(-0.25))
      .multiply(new THREE.Matrix4().makeScale(1.2, 0.4, 0.6));
    petal.applyMatrix4(m);
    parts.push(petal);
  }
  return mergeGeos(parts, false);
}

function buildCedarSource() {
  const parts = [];
  // trunk
  parts.push(transformed(new THREE.CylinderGeometry(0.12, 0.18, 2.4, 10, 4), { pos: [0, 1.2, 0] }));
  // foliage cones, stacked
  const layers = [
    { y: 1.5, r: 0.95, h: 1.2 },
    { y: 2.1, r: 0.8,  h: 1.1 },
    { y: 2.7, r: 0.6,  h: 0.9 },
    { y: 3.3, r: 0.35, h: 0.7 },
  ];
  for (const L of layers) {
    parts.push(transformed(new THREE.ConeGeometry(L.r, L.h, 12, 3), { pos: [0, L.y, 0] }));
  }
  return mergeGeos(parts, false);
}

function buildVetiverSource() {
  const parts = [];
  // tuft of grass blades
  const N = 26;
  for (let i = 0; i < N; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.45;
    const h = 0.6 + Math.random() * 0.7;
    const tilt = (Math.random() - 0.5) * 0.5;
    const blade = new THREE.PlaneGeometry(0.04, h, 1, 3);
    const m = new THREE.Matrix4()
      .multiply(new THREE.Matrix4().makeTranslation(Math.cos(a) * r, h * 0.5, Math.sin(a) * r))
      .multiply(new THREE.Matrix4().makeRotationY(Math.random() * Math.PI))
      .multiply(new THREE.Matrix4().makeRotationZ(tilt));
    blade.applyMatrix4(m);
    parts.push(blade);
  }
  return mergeGeos(parts, false);
}

function buildSaffronSource() {
  const parts = [];
  // small clustered bulbs at low height
  const N = 9;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + Math.random() * 0.4;
    const r = 0.15 + Math.random() * 0.35;
    parts.push(transformed(
      new THREE.IcosahedronGeometry(0.12 + Math.random() * 0.06, 1),
      { pos: [Math.cos(a) * r, 0.18 + Math.random() * 0.15, Math.sin(a) * r] }
    ));
  }
  // slim curling threads (the saffron strands)
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.1 + Math.random() * 0.3;
    const thread = new THREE.TorusGeometry(0.12, 0.012, 4, 8, Math.PI * 0.7);
    const m = new THREE.Matrix4()
      .multiply(new THREE.Matrix4().makeTranslation(Math.cos(a) * r, 0.35 + Math.random() * 0.15, Math.sin(a) * r))
      .multiply(new THREE.Matrix4().makeRotationY(Math.random() * Math.PI * 2))
      .multiply(new THREE.Matrix4().makeRotationX(Math.PI * 0.5));
    thread.applyMatrix4(m);
    parts.push(thread);
  }
  return mergeGeos(parts, false);
}

function buildAmberSource() {
  const parts = [];
  // smooth elongated drop (resin form)
  parts.push(transformed(new THREE.SphereGeometry(0.5, 18, 14), { pos: [0, 0.55, 0], scl: [1, 1.4, 1] }));
  // base puddle
  parts.push(transformed(new THREE.SphereGeometry(0.45, 18, 10), { pos: [0, 0.06, 0], scl: [1.4, 0.18, 1.4] }));
  return mergeGeos(parts, false);
}

// ────────────────────────────────────────────────────────────────
// FRAGRANCE LANDMARKS
// ────────────────────────────────────────────────────────────────
const LANDMARKS = [
  {
    id: 'lotus',
    label: 'Lotus',
    category: 'Floral',
    notes: ['soft', 'watery', 'airy'],
    position: [0, 0, -7.5],
    color: new THREE.Color('#f4c8d6'),
    accent: new THREE.Color('#ffeaf2'),
    build: buildLotusSource,
    count: 3500,
    size: 7.5,
    sway: 0.018,
    swayFreq: 0.7,
    proxyScale: [1.6, 2.2, 1.6],
  },
  {
    id: 'cedar',
    label: 'Cedar',
    category: 'Woody',
    notes: ['dry', 'warm', 'resinous'],
    position: [-7.5, 0, 4],
    color: new THREE.Color('#a07842'),
    accent: new THREE.Color('#e8c890'),
    build: buildCedarSource,
    count: 5500,
    size: 5.5,
    sway: 0.032,
    swayFreq: 0.45,
    proxyScale: [1.1, 1.05, 1.1],
  },
  {
    id: 'vetiver',
    label: 'Vetiver',
    category: 'Fresh',
    notes: ['green', 'dewy', 'crisp'],
    position: [8, 0, 5],
    color: new THREE.Color('#6fa55a'),
    accent: new THREE.Color('#bde08a'),
    build: buildVetiverSource,
    count: 4500,
    size: 5.0,
    sway: 0.045,
    swayFreq: 0.9,
    proxyScale: [1.3, 1.2, 1.3],
  },
  {
    id: 'saffron',
    label: 'Saffron',
    category: 'Spice',
    notes: ['smoky', 'amber', 'deep'],
    position: [4.5, 0, -6.5],
    color: new THREE.Color('#d96528'),
    accent: new THREE.Color('#ffae6b'),
    build: buildSaffronSource,
    count: 3200,
    size: 6.5,
    sway: 0.022,
    swayFreq: 0.55,
    proxyScale: [1.6, 1.8, 1.6],
  },
  {
    id: 'amber',
    label: 'Amber',
    category: 'Resin',
    notes: ['golden', 'sweet', 'enveloping'],
    position: [-5.5, 0, -5.5],
    color: new THREE.Color('#cc8c3a'),
    accent: new THREE.Color('#ffd58a'),
    build: buildAmberSource,
    count: 4000,
    size: 7.0,
    sway: 0.012,
    swayFreq: 0.4,
    proxyScale: [1.4, 1.2, 1.4],
  },
];

const landmarkRefs = []; // { id, group, particles, material, proxy, meta, currentHL }

function addLandmark(spec) {
  const group = new THREE.Group();
  group.position.set(...spec.position);
  group.rotation.y = Math.random() * Math.PI * 2;

  const sourceGeo = spec.build();

  // Invisible proxy mesh (logic layer): used for raycasting
  const proxyGeo = sourceGeo.clone();
  const proxyMat = new THREE.MeshBasicMaterial({ visible: false });
  const proxy = new THREE.Mesh(proxyGeo, proxyMat);
  proxy.scale.set(...spec.proxyScale);
  proxy.userData = {
    isLandmark: true,
    id: spec.id,
    label: spec.label,
    category: spec.category,
    notes: spec.notes,
    color: spec.color,
  };
  group.add(proxy);

  // Visible particle layer
  const { points, material } = createParticleSystem({
    sourceGeometry: sourceGeo,
    count: spec.count,
    color: spec.color,
    highlightColor: spec.accent,
    size: spec.size,
    swayAmt: spec.sway,
    swayFreq: spec.swayFreq,
    opacity: 0.92,
  });
  group.add(points);

  scene.add(group);

  const ref = {
    id: spec.id,
    group, particles: points, material, proxy,
    meta: { label: spec.label, category: spec.category, notes: spec.notes, color: spec.color, accent: spec.accent },
    currentHL: 0,
  };
  landmarkRefs.push(ref);
  return ref;
}

// ────────────────────────────────────────────────────────────────
// MOSS GROUND — high-density particle carpet
// ────────────────────────────────────────────────────────────────
function buildGround() {
  const count = 32000;
  const positions = new Float32Array(count * 3);
  const colors    = new Float32Array(count * 3);
  const sizes     = new Float32Array(count);
  const seeds     = new Float32Array(count);

  const baseA = new THREE.Color('#2a4a24');
  const baseB = new THREE.Color('#5a8540');
  const baseC = new THREE.Color('#8aa860');
  const tmp   = new THREE.Color();
  const palette = [baseA, baseB, baseC];

  for (let i = 0; i < count; i++) {
    // disk-uniform sampling
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * (WORLD_RADIUS + 2);
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;

    // gentle vertical noise — feels like uneven moss carpet
    const n = Math.sin(x * 0.7 + z * 0.3) * 0.06
            + Math.cos(z * 0.9 - x * 0.4) * 0.05
            + Math.random() * 0.10;
    const y = 0.02 + n;

    positions[i * 3 + 0] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    // pick a base then jitter
    tmp.copy(palette[(Math.random() * palette.length) | 0]);
    const hsl = { h: 0, s: 0, l: 0 };
    tmp.getHSL(hsl);
    tmp.setHSL(
      hsl.h + (Math.random() - 0.5) * 0.04,
      THREE.MathUtils.clamp(hsl.s + (Math.random() - 0.5) * 0.15, 0, 1),
      THREE.MathUtils.clamp(hsl.l + (Math.random() - 0.5) * 0.22, 0, 1)
    );
    colors[i * 3 + 0] = tmp.r;
    colors[i * 3 + 1] = tmp.g;
    colors[i * 3 + 2] = tmp.b;

    sizes[i] = 2.0 + Math.random() * 4.5;
    seeds[i] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(colors,    3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(sizes,     1));
  geo.setAttribute('aSeed',    new THREE.BufferAttribute(seeds,     1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:           { value: 0 },
      uHighlight:      { value: 0 },
      uPixelRatio:     { value: renderer.getPixelRatio() },
      uSwayAmt:        { value: 0.012 },
      uSwayFreq:       { value: 0.35 },
      uFogColor:       { value: FOG_COLOR },
      uFogDensity:     { value: 0.05 },
      uOpacity:        { value: 0.85 },
      uHighlightColor: { value: ACCENT_COLOR },
    },
    vertexShader:   PARTICLE_VERT,
    fragmentShader: PARTICLE_FRAG,
    transparent:    true,
    depthWrite:     false,
    blending:       THREE.AdditiveBlending,
  });

  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  scene.add(points);
  return { points, material: mat };
}

// ────────────────────────────────────────────────────────────────
// LOADING (fast — synthetic, no GLBs)
// ────────────────────────────────────────────────────────────────
const bar          = document.getElementById('loading-bar');
const loadingLabel = document.getElementById('loading-label');
const loadingEl    = document.getElementById('loading');
const enterEl      = document.getElementById('enter');

const stages = [
  { label: 'seeding the field…',     fn: () => buildGround() },
  { label: 'unfolding lotus…',       fn: () => addLandmark(LANDMARKS[0]) },
  { label: 'rooting cedar…',         fn: () => addLandmark(LANDMARKS[1]) },
  { label: 'gathering vetiver…',     fn: () => addLandmark(LANDMARKS[2]) },
  { label: 'drying saffron…',        fn: () => addLandmark(LANDMARKS[3]) },
  { label: 'pouring amber…',         fn: () => addLandmark(LANDMARKS[4]) },
];

async function boot() {
  let groundRef;
  for (let i = 0; i < stages.length; i++) {
    loadingLabel.textContent = stages[i].label;
    await new Promise(r => requestAnimationFrame(r));
    const result = stages[i].fn();
    if (i === 0) groundRef = result;
    bar.style.width = ((i + 1) / stages.length * 100) + '%';
    await new Promise(r => setTimeout(r, 90));
  }
  loadingLabel.textContent = 'the field is ready';
  bar.style.width = '100%';

  // start render loop
  setupInteraction(groundRef);
  animate();

  await new Promise(r => setTimeout(r, 350));
  loadingEl.classList.add('hidden');
  setTimeout(() => { loadingEl.style.display = 'none'; }, 800);
  enterEl.classList.remove('hidden');
}

// ────────────────────────────────────────────────────────────────
// FIRST-PERSON CONTROLS + INTERACTION
// ────────────────────────────────────────────────────────────────
const keys = Object.create(null);
let yaw = 0, pitch = 0;
let pointerLocked = false;
const move = new THREE.Vector3();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const upY = new THREE.Vector3(0, 1, 0);

function setupInteraction(groundRef) {
  // pointer lock entry
  enterEl.addEventListener('click', () => canvas.requestPointerLock());
  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === canvas;
    enterEl.classList.toggle('hidden', pointerLocked);
  });
  document.addEventListener('mousemove', e => {
    if (!pointerLocked) return;
    yaw   -= e.movementX * LOOK_SENS;
    pitch -= e.movementY * LOOK_SENS;
    pitch  = THREE.MathUtils.clamp(pitch, -Math.PI / 2.4, Math.PI / 2.4);
  });

  window.addEventListener('keydown', e => { keys[e.code] = true; });
  window.addEventListener('keyup',   e => { keys[e.code] = false; });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// ────────────────────────────────────────────────────────────────
// TOOLTIP / RAYCAST
// ────────────────────────────────────────────────────────────────
const ttEl    = document.getElementById('tooltip');
const ttWord  = document.getElementById('tooltip-word');
const ttCat   = document.getElementById('tooltip-cat');
const ttNotes = document.getElementById('tooltip-notes');
const reticle = document.getElementById('reticle');
const compass = document.getElementById('compass-deg');

const raycaster = new THREE.Raycaster();
const centerNDC = new THREE.Vector2(0, 0); // first-person reticle
let hoveredId = null;

function findLandmark(obj) {
  let cur = obj;
  while (cur) {
    if (cur.userData && cur.userData.isLandmark) return cur;
    cur = cur.parent;
  }
  return null;
}

function updateRaycast() {
  raycaster.setFromCamera(centerNDC, camera);
  const proxies = landmarkRefs.map(r => r.proxy);
  const hits = raycaster.intersectObjects(proxies, false);

  let newId = null;
  if (hits.length > 0) {
    // distance gate — must be reasonably close (~12m)
    if (hits[0].distance < 14) {
      const lm = findLandmark(hits[0].object);
      if (lm) newId = lm.userData.id;
    }
  }

  if (newId !== hoveredId) {
    hoveredId = newId;
    if (newId) {
      const ref = landmarkRefs.find(r => r.id === newId);
      const m = ref.meta;
      ttWord.textContent = m.label;
      ttWord.style.color = '#' + m.accent.getHexString();
      ttCat.textContent = m.category;
      ttCat.style.color = '#' + m.color.getHexString();
      ttNotes.textContent = m.notes.join('  ·  ');
      ttEl.classList.add('visible');
      reticle.classList.add('focus');
    } else {
      ttEl.classList.remove('visible');
      reticle.classList.remove('focus');
    }
  }
}

// ────────────────────────────────────────────────────────────────
// MAIN LOOP
// ────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
const allMaterials = []; // collected after scene built
function collectMaterials() {
  allMaterials.length = 0;
  scene.traverse(o => {
    if (o.isPoints && o.material && o.material.uniforms) allMaterials.push(o.material);
  });
}

function updateMovement(dt) {
  if (!pointerLocked) return;

  // forward = camera facing projected to ground plane
  forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  right.crossVectors(forward, upY).negate();

  move.set(0, 0, 0);
  if (keys['KeyW'] || keys['ArrowUp'])    move.add(forward);
  if (keys['KeyS'] || keys['ArrowDown'])  move.sub(forward);
  if (keys['KeyA'] || keys['ArrowLeft'])  move.sub(right);
  if (keys['KeyD'] || keys['ArrowRight']) move.add(right);

  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(MOVE_SPEED * dt);
    camera.position.add(move);

    // soft proxy collision — push out of landmark cylinders
    for (const ref of landmarkRefs) {
      const lp = ref.group.position;
      const dx = camera.position.x - lp.x;
      const dz = camera.position.z - lp.z;
      const distSq = dx * dx + dz * dz;
      const minR = 1.0;
      if (distSq < minR * minR && distSq > 1e-6) {
        const d = Math.sqrt(distSq);
        camera.position.x = lp.x + (dx / d) * minR;
        camera.position.z = lp.z + (dz / d) * minR;
      }
    }

    // bound to garden disk
    const r2 = camera.position.x ** 2 + camera.position.z ** 2;
    if (r2 > WORLD_RADIUS * WORLD_RADIUS) {
      const d = Math.sqrt(r2);
      camera.position.x *= WORLD_RADIUS / d;
      camera.position.z *= WORLD_RADIUS / d;
    }
  }

  camera.position.y = EYE_HEIGHT;
}

function updateCamera() {
  const cosP = Math.cos(pitch);
  const lookDir = new THREE.Vector3(
    -Math.sin(yaw) * cosP,
     Math.sin(pitch),
    -Math.cos(yaw) * cosP,
  );
  camera.lookAt(camera.position.clone().add(lookDir));

  // compass cardinal label
  const deg = ((-yaw * 180 / Math.PI) % 360 + 360) % 360;
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  compass.textContent = dirs[Math.round(deg / 45) % 8];
}

function updateHighlights(dt) {
  for (const ref of landmarkRefs) {
    const target = (ref.id === hoveredId) ? 1 : 0;
    ref.currentHL = THREE.MathUtils.damp(ref.currentHL, target, 6, dt);
    ref.material.uniforms.uHighlight.value = ref.currentHL;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  updateMovement(dt);
  updateCamera();
  updateRaycast();
  updateHighlights(dt);

  if (allMaterials.length === 0) collectMaterials();
  for (const m of allMaterials) m.uniforms.uTime.value = t;

  renderer.render(scene, camera);
}

boot();
</script>
</body>
</html>
